<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One call, three outcomes</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #fbf4fa; color: #251e20;
    font: 400 15px/1.65 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 40px 28px 72px;
  }
  main { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: #6f6467; margin: 0 0 32px; }
  svg { width: 100%; height: auto; display: block; }
  .node rect { fill: #ffffff; stroke: #e2e8ef; stroke-width: 1.5; rx: 10; }
  .node.native rect { fill: #fff5f4; stroke: #e6433c; stroke-width: 2; }
  .node.web rect { fill: #ffffff; stroke: #e2e8ef; }
  .node .title { font: 600 14px/1.3 -apple-system, system-ui, sans-serif; fill: #251e20; }
  .node .body { font: 400 12px/1.45 -apple-system, system-ui, sans-serif; fill: #6f6467; }
  .node .chip { font: 700 10px/1 ui-monospace, monospace; fill: #e6433c; letter-spacing: 0.08em; }
  .band { fill: none; stroke: #e2e8ef; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 14; }
  .band-label { font: 600 11px/1 ui-monospace, monospace; fill: #6f6467; letter-spacing: 0.1em; }
  .edge { stroke: #6f6467; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .edge.hot { stroke: #e6433c; stroke-width: 2.2; }
  .edge-label { font: 400 11px/1 ui-monospace, monospace; fill: #6f6467; }
  footer { margin-top: 36px; color: #6f6467; font-size: 13px; }
  code { font-family: ui-monospace, SFMono-Regular, monospace; color: #e6433c; }
</style>
</head>
<body>
<main>
  <h1>One call, three outcomes</h1>
  <p class="sub">What happens to a single native call, from the component down to whichever platform answers it.</p>
  <svg viewBox="0 0 1040 470" role="img" aria-label="Flow of one native capability call">
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6467" />
  </marker>
</defs>
  
  <g class="node web">
    <rect x="360" y="20" width="320" height="69" />
    <text class="chip" x="374" y="40">CALL</text>
    <text class="title" x="374" y="60">Component calls currentPosition()</text>
    <text class="body" x="374" y="80">awaited, no try/catch needed</text>
  </g>

  <path class="edge" d="M 520 92 L 520 140" />
  <path class="edge-label" x="530" y="122">await</path>

  
  <g class="node web">
    <rect x="360" y="140" width="320" height="69" />
    <text class="chip" x="374" y="160">GATE</text>
    <text class="title" x="374" y="180">isNative()</text>
    <text class="body" x="374" y="200">Capacitor.getPlatform() !== 'web'</text>
  </g>

  <path class="edge hot" d="M 360 214 L 200 214 L 200 262" />
  <path class="edge-label" x="250" y="204">native</path>
  <path class="edge" d="M 680 214 L 840 214 L 840 262" />
  <path class="edge-label" x="760" y="204">web</path>

  
  <g class="node native">
    <rect x="40" y="262" width="320" height="51" />
    
    <text class="title" x="54" y="286">dynamic import('@capacitor/geolocation')</text>
    <text class="body" x="54" y="304">Geolocation.getCurrentPosition</text>
  </g>
  
  <g class="node web">
    <rect x="680" y="262" width="320" height="51" />
    
    <text class="title" x="694" y="286">navigator.geolocation.getCurrentPosition</text>
    <text class="body" x="694" y="304">gated on a secure context</text>
  </g>

  <path class="edge" d="M 200 336 L 200 384" />
  <path class="edge" d="M 840 336 L 840 384" />

  
  <g class="node native">
    <rect x="40" y="384" width="320" height="69" />
    <text class="chip" x="54" y="404">SUCCESS</text>
    <text class="title" x="54" y="424">Coords</text>
    <text class="body" x="54" y="444">from the OS location provider</text>
  </g>
  
  <g class="node web">
    <rect x="680" y="384" width="320" height="69" />
    <text class="chip" x="694" y="404">SUCCESS</text>
    <text class="title" x="694" y="424">Coords or null</text>
    <text class="body" x="694" y="444">null on deny, or insecure origin</text>
  </g>

  <text class="body" x="392" y="300">Both branches resolve to the same</text>
  <text class="body" x="392" y="318">type, so the caller has one code</text>
  <text class="body" x="392" y="336">path — and a null it can test.</text>
</svg>
  <footer>Generated by <code>tools/make-diagrams.mjs</code> — standalone, no dependencies.</footer>
</main>
</body>
</html>
