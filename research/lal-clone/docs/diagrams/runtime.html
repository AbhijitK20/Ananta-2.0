<title>Native runtime — what happens on a launch</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #fbf4fa; color: #251e20;
    font: 400 15px/1.65 -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: 40px 28px 72px;
  }
  main { max-width: 1080px; margin: 0 auto; }

  svg { width: 100%; height: auto; display: block; }
  .node rect { fill: #ffffff; stroke: #e2e8ef; stroke-width: 1.5; rx: 10; }
  .node.native rect { fill: #fff5f4; stroke: #e6433c; stroke-width: 2; }
  .node.web rect { fill: #ffffff; stroke: #e2e8ef; }
  .node .title { font: 600 14px/1.3 -apple-system, system-ui, sans-serif; fill: #251e20; }
  .node .body { font: 400 12px/1.45 -apple-system, system-ui, sans-serif; fill: #6f6467; }
  .node .chip { font: 700 10px/1 ui-monospace, monospace; fill: #e6433c; letter-spacing: 0.08em; }
  .band { fill: none; stroke: #e2e8ef; stroke-width: 1.5; stroke-dasharray: 5 4; rx: 14; }
  .band-label { font: 600 11px/1 ui-monospace, monospace; fill: #6f6467; letter-spacing: 0.1em; }
  .edge { stroke: #6f6467; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .edge.hot { stroke: #e6433c; stroke-width: 2.2; }
  .edge-label { font: 400 11px/1 ui-monospace, monospace; fill: #6f6467; }

<body>
<main>
  <h1>Native runtime — what happens on a launch</h1>
  <p class="sub">The app is a webview with a native API surface. The web layer is the same code the browser runs; the native layer is a thin set of plugins.</p>
  <svg viewBox="0 0 1040 560" role="img" aria-label="Diagram of the native runtime">
  <defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#6f6467" />
  </marker>
</defs>
  <rect class="band" x="20" y="20" width="1000" height="150" />
  <text class="band-label" x="34" y="42">NATIVE — ANDROID PROCESS</text>

  
  <g class="node native">
    <rect x="44" y="58" width="200" height="69" />
    <text class="chip" x="58" y="78">HOST</text>
    <text class="title" x="58" y="98">MainActivity</text>
    <text class="body" x="58" y="118">singleTask, WebView host</text>
  </g>
  
  <g class="node native">
    <rect x="268" y="58" width="232" height="66" />
    
    <text class="title" x="282" y="82">Capacitor Bridge</text>
    <text class="body" x="282" y="100">JS &lt;-&gt; native channel</text><text class="body" x="282" y="115">plugin registry</text>
  </g>
  
  <g class="node native">
    <rect x="524" y="58" width="224" height="66" />
    
    <text class="title" x="538" y="82">8 plugins</text>
    <text class="body" x="538" y="100">geolocation, haptics, share</text><text class="body" x="538" y="115">push, splash, status bar</text>
  </g>
  
  <g class="node native">
    <rect x="772" y="58" width="224" height="66" />
    
    <text class="title" x="786" y="82">Android OS</text>
    <text class="body" x="786" y="100">LocationManager, vibrator</text><text class="body" x="786" y="115">intent chooser, FCM</text>
  </g>

  <path class="edge" d="M 244 100 L 268 100" />
  <path class="edge" d="M 500 100 L 524 100" />
  <path class="edge" d="M 748 100 L 772 100" />

  <rect class="band" x="20" y="200" width="1000" height="240" />
  <text class="band-label" x="34" y="222">WEBVIEW — THE SAME CODE THE BROWSER RUNS</text>

  
  <g class="node web">
    <rect x="44" y="238" width="250" height="84" />
    <text class="chip" x="58" y="258">NEXT</text>
    <text class="title" x="58" y="278">app/ routes</text>
    <text class="body" x="58" y="298">Next.js, server-rendered</text><text class="body" x="58" y="313">9 routes, 160+ guides</text>
  </g>
  
  <g class="node web">
    <rect x="318" y="238" width="264" height="84" />
    <text class="chip" x="332" y="258">SEAM</text>
    <text class="title" x="332" y="278">lib/native/bridge.ts</text>
    <text class="body" x="332" y="298">the ONLY @capacitor importer</text><text class="body" x="332" y="313">every call has a web fallback</text>
  </g>
  
  <g class="node web">
    <rect x="606" y="238" width="200" height="66" />
    
    <text class="title" x="620" y="262">NativeShell</text>
    <text class="body" x="620" y="280">mounted in root layout</text><text class="body" x="620" y="295">renders nothing</text>
  </g>
  
  <g class="node web">
    <rect x="830" y="238" width="166" height="66" />
    
    <text class="title" x="844" y="262">CSS tokens</text>
    <text class="body" x="844" y="280">--lal-safe-*</text><text class="body" x="844" y="295">max() insets</text>
  </g>

  <path class="edge" d="M 294 276 L 318 276" />
  <path class="edge" d="M 582 276 L 606 276" />
  <path class="edge" d="M 706 316 L 706 420" />

  <rect class="band" x="20" y="470" width="1000" height="72" />
  <text class="band-label" x="34" y="492">NETWORK</text>
  
  <g class="node web">
    <rect x="44" y="500" width="300" height="51" />
    
    <text class="title" x="58" y="524">Next.js server</text>
    <text class="body" x="58" y="542">API routes + SSG pages</text>
  </g>
  
  <g class="node web">
    <rect x="368" y="500" width="300" height="66" />
    
    <text class="title" x="382" y="524">CAP_SERVER_URL</text>
    <text class="body" x="382" y="542">a running origin, always</text><text class="body" x="382" y="557">no Node inside a webview</text>
  </g>
  
  <g class="node native">
    <rect x="692" y="500" width="304" height="51" />
    
    <text class="title" x="706" y="524">Native plugins</text>
    <text class="body" x="706" y="542">the real device capability</text>
  </g>

  <path class="edge hot" d="M 668 528 L 692 528" />
</svg>

</main>
