#   - uses: actions/setup-java@v4
#     with: { distribution: temurin, java-version: 21 }
#   - name: Decode the keystore
#     run: |
#       echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
#   - name: Bundle for Play
#     working-directory: research/lal-clone/android
#     env:
#       KEYSTORE_PATH: app/release.keystore
#       KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
#       KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
#       KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
#     run: ./gradlew bundleRelease --no-daemon
#
# `signingConfigs` has to be wired into `android/app/build.gradle` for those
# variables to be read. Do not commit the keystore.
# ---------------------------------------------------------------------------
