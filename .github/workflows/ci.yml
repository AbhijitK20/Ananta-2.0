name: ci

# TASKS.md working agreements: "main must always typecheck", and
# DESIGN_SYSTEM §6: "Put it in CI." A design system without a gate is a mood
# board, and TREK's own token guarantee decayed into an inline hex the moment
# nobody enforced it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The committed package-lock.json currently has 23 entries with no
      # `version` field, which makes `npm ci` abort with "Invalid Version:".
      # Regenerating it is Abhijit's call (TASKS.md: package.json is a group
      # decision), so CI installs without it rather than being left permanently
      # red. Delete this step once the lockfile is repaired.
      - name: Install
        run: npm install --no-package-lock

      - name: Approve install scripts (esbuild is required by tsx)
        run: |
          npm install-scripts approve esbuild || true
          npm install-scripts approve unrs-resolver || true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Token gate — no colour literal outside tokens.css
        run: npx tsx scripts/theme-lint.ts

      - name: Copy gate — no emoji, banned filler, or colon reveals
        run: npx tsx scripts/copy-lint.ts

      - name: Contrast gate — every token pair, both themes, WCAG AA
        run: npx tsx scripts/contrast-lint.ts

      - name: Build
        run: npx next build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-package-lock
      - run: npm install-scripts approve unrs-resolver || true
      - run: npx next lint
